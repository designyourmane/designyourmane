<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | Design Your Mane</title>
    <style>
        :root { --accent: #e60023; --dark: #111; --light-bg: #f8f9fa; }
        body { font-family: 'Inter', sans-serif; margin: 0; background: var(--light-bg); color: #333; overflow: hidden; }

        /* ── NAVBAR (Sabit Tutuyoruz) ── */
        nav {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0,0,0,0.06);
            height: 64px;
            display: flex;
            align-items: center;
        }
        .nav-container { max-width: 1200px; margin: 0 auto; width: 100%; display: flex; justify-content: space-between; padding: 0 28px; }
        .logo { font-weight: 900; font-size: 1.1rem; letter-spacing: 0.12em; text-decoration: none; color: var(--dark); text-transform: uppercase; }
        .logo span { color: var(--accent); }

        /* ── COMING SOON CONTENT ── */
        .coming-soon-wrapper {
            height: calc(100vh - 64px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .badge {
            background: rgba(230,0,35,0.1);
            color: var(--accent);
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        h1 { font-size: 4rem; margin: 0; color: var(--dark); letter-spacing: -2px; line-height: 1; }
        p { color: #888; font-size: 1.2rem; max-width: 500px; margin: 20px 0 40px; }

        /* ── ANIMASYONLU ÇİZGİ ── */
        .loader-bar {
            width: 200px;
            height: 2px;
            background: #eee;
            position: relative;
            overflow: hidden;
            margin-bottom: 40px;
        }
        .loader-bar::after {
            content: '';
            position: absolute;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--accent);
            animation: loading 2s infinite;
        }
        @keyframes loading {
            0% { left: -100%; }
            50% { left: 0%; }
            100% { left: 100%; }
        }

        .cta-button {
            background: var(--dark);
            color: white;
            text-decoration: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-weight: 600;
            transition: 0.3s;
        }
        .cta-button:hover { background: var(--accent); transform: translateY(-3px); }

    </style>
</head>
<body>

<nav>
    <div class="nav-container">
        <a href="index.html" class="logo">Design Your <span>Mane</span></a>
    </div>
</nav>

<div class="coming-soon-wrapper">
    <div class="badge">Under Construction</div>
    <h1>Something Beautiful <br> is Coming.</h1>
    <p>We are currently curating the most exclusive hair trends and tutorials for 2026. Stay tuned!</p>
    
    <div class="loader-bar"></div>

    <a href="https://pinterest.com/designyourmane" class="cta-button">Follow Our Progress on Pinterest</a>
</div>

</body>
</html>
